<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Create Account</title>

    <link rel="stylesheet" href="/css/style.css" />

    <script src="../js/register.js" type="module"></script>
  </head>

  <body>
    <header class="divider">
      <div class="logo">
        <img
          src="/images/noun_Tent_2517.svg"
          alt="tent image for logo"
        />
        <a href="/index.html">
          Sleep<span class="highlight">Outside</span>
        </a>
      </div>

      <nav class="site-nav">
        <a href="/index.html">Home</a>
        <a href="/register/">Register</a>
        <a href="../cart/index.html">Cart</a>
      </nav>
    </header>

    <main class="divider">
      <section class="registration">
        <h1>Create an Account</h1>

        <form id="registration-form">
          <label for="name">Full Name</label>
          <input
            type="text"
            id="name"
            name="name"
            required
          />

          <label for="address">Address</label>
          <input
            type="text"
            id="address"
            name="address"
            required
          />

          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            required
          />

          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            required
          />

          <button type="submit" class="button">
            Create Account
          </button>
        </form>

        <p id="registration-message"></p>
      </section>
    </main>

    <footer>
      &copy; NOT a real business
    </footer>
  </body>
</html>
